# Cloud server: docker compose up -d --build
#   app   = NetraAttend web role (website + API), not reachable directly
#   caddy = https in front of it, free Let's Encrypt certificate for $DOMAIN
services:
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      NETRA_ROLE: web
    expose:
      - "5000"

  caddy:
    image: caddy:2.8
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
