<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · NetraAttend</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="login-wrap">
  <form class="login" method="post">
    <div class="brand">
      <div class="eye"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
      <div>NetraAttend<small>{{ company }} · Smart Attendance</small></div>
    </div>
    {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="f" for="u">Username / Employee ID</label>
    <input id="u" name="u" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus>
    <label class="f" for="p">Password</label>
    <input id="p" name="p" type="password" autocomplete="current-password" required>
    <button class="btn">Sign in</button>
  </form>
</div>
</body>
</html>
